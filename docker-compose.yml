 # Host bind mount (./uploads:/app/uploads) vs Named volume (uploads:/app/uploads):
  # Host bind mount:
    # Maps a directory on the host machine (./uploads) to a directory in the container (/app/uploads)
    # Changes in the host directory are immediately reflected in the container and vice versa
    # Useful for development when you want to see changes in real-time or persist data on the host
    # Can lead to permission issues and is less portable across different environments
  # Named volume:
    # Managed by Docker and stored in Docker's storage area (not directly accessible on the host)
    # Provides data persistence across container restarts and recreations
    # More portable and avoids permission issues since Docker manages the volume
    # Useful for production environments where you want to ensure data persistence without relying on host directory structure

# Nginx and reverse proxy:
  # Nginx is a web server that can also be used as a reverse proxy to route incoming requests to different backend services based on URL patterns, load balance traffic, and handle SSL termination.
  # A reverse proxy is a service that sits in front of your backend apps (like your api container). Instead of clients hitting your API directly, they hit Nginx first. Nginx then forwards the request internally to your API service.
  # why use:
  #  # security: You don’t expose your database or internal services to the outside world. Only Nginx is exposed.
  #  # Routing: Nginx can handle multiple apps on one server
  #   # Load balancing: It can distribute traffic across multiple API containers.
  #  # SSL termination: Nginx can handle HTTPS and forward requests to your API over HTTP, simplifying your API configuration.