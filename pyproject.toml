[project]
name = "document-assistant"
version = "1.0.0"
description = "Document analysis assistant with FastAPI, SQLAlchemy, and LLM integration"
authors = [{name = "Geethu"}]
readme = "README.md"
requires-python = ">=3.13.1,<3.14"
dynamic = ["dependencies"]

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.13.1,<3.14"

# Web Framework
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.35.0"}
pydantic = "^2.11.0"
celery = "^5.6"
psycopg2-binary = "^2.9"

# Authentication
fastapi-users = {extras = ["sqlalchemy"], version = "^13.0.0"}

# Database
sqlalchemy = {extras = ["asyncio"], version = "^2.0.0"}
python-dotenv = "^1.1.0"
asyncpg = "*" 
redis = "^7.4"

# Document Processing
pymupdf = "^1.26.0"
python-docx = "^1.2.0"

# Search & Embeddings
chromadb = "^1.1.0"
sentence-transformers = "^5.1.0"
pandas = "^2.3.0"
rank_bm25 = "^0.2.2"

# LLM Integration
groq = "^0.32.0"
langchain = "^0.3.0"
langchain-groq = "^0.3.0"
langchain-community = "^0.3.0"
tiktoken = "^0.11.0"
torch = {version = "^2.0", source = "pytorch-cpu"}

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
black = "^24.1.0"
flake8 = "^7.0.0"
mypy = "^1.8.0"
isort = "^5.13.0"
ragas = "^0.4"

[build-system]
requires = ["poetry-core"]
Dataset = "^4.8"

build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312', 'py313']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"
