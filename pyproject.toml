[tool.poetry]
name = "document-assistant"
version = "1.0.0"
description = "Document analysis assistant with FastAPI, SQLAlchemy, and LLM integration"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{include = "document_assistant"}]

[tool.poetry.dependencies]
python = "^3.10"

# Web Framework
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.35.0"}
pydantic = "^2.11.0"
python-multipart = "^0.0.9"

# Authentication
fastapi-users = {extras = ["sqlalchemy"], version = "^13.0.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.0"}
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
bcrypt = "^4.1.0"

# Database
sqlalchemy = {extras = ["asyncio"], version = "^2.0.0"}
aiosqlite = "^0.20.0"
python-dotenv = "^1.1.0"
asyncpg = "*" 
redis = "*"

# Document Processing
pymupdf = "^1.26.0"
python-docx = "^1.2.0"

# Search & Embeddings
chromadb = "^1.1.0"
sentence-transformers = "^5.1.0"
scikit-learn = "^1.7.0"
pandas = "^2.3.0"
# qdrant-client = "*"

# LLM Integration
groq = "^0.32.0"
langchain = "^0.3.0"
langchain-groq = "^0.3.0"
langchain-community = "^0.3.0"
tiktoken = "^0.11.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
black = "^24.1.0"
flake8 = "^7.0.0"
mypy = "^1.8.0"
isort = "^5.13.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312', 'py313']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
